[project]
name = "velqron"
version = "1.0.0"
description = "Physics-Grounded Industrial Motor Stress Intelligence Platform"
authors = [
    { name = "Rizwin Ahamed", email = "rizwin@fleqtor.com" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "pandas>=2.2.1",
    "streamlit>=1.32.0",
    "pyserial>=3.5",
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.1.1",
    "pydantic-settings>=2.2.1",
    "scikit-learn>=1.4.0",
    "onnxruntime>=1.17.0",
    "httpx>=0.27.0",
    "pypdf>=6.13.0",
    "matplotlib>=3.8.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
extraPaths = ["."]

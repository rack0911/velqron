    <!-- Engine 1 & 2 Output -->
    <text x="0" y="66" fill="#fbbf24" font-size="13" font-weight="700">⚙️ ENGINE FACTS:</text>
    <text x="130" y="66" fill="#fef08a" font-size="13">LPTN_Thermal_Twin: Stator Winding Temp Rise +34°C | Insulation Arrhenius Accel: 1.82x</text>
    <text x="130" y="88" fill="#fef08a" font-size="13">TinyML ONNX: Bearing Outer Race Defect (Probability: 0.887)</text>


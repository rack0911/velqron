<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" style="background-color: #0b0f19; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;">
  <defs>

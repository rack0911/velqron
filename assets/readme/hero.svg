<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" style="background-color: #0b0f19; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="480" fill="url(#bgGradient)" />
  <rect width="1200" height="480" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="440" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Top Status Bar -->
  <g transform="translate(45, 45)">
    <!-- Industrial Status Badge -->
    <rect x="0" y="0" width="170" height="28" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#10b981"/>
    <text x="28" y="18" fill="#e2e8f0" font-size="12" font-weight="700" letter-spacing="1">[SYSTEM LOGIC OK]</text>

    <rect x="180" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="192" y="18" fill="#94a3b8" font-size="11" font-weight="600">[OFFLINE EDGE RAG]</text>

    <rect x="330" y="0" width="150" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="342" y="18" fill="#94a3b8" font-size="11" font-weight="600">[LPTN THERMAL TWIN]</text>
  </g>

  <!-- Left Side: Typography & Core Pitch -->
  <g transform="translate(45, 115)">
    <!-- Subtitle / Tagline -->
    <text x="0" y="20" fill="#38bdf8" font-size="14" font-weight="800" letter-spacing="2.5">DETERMINISTIC EDGE DIAGNOSTICS</text>
    
    <!-- Title -->
    <text x="0" y="70" fill="#ffffff" font-size="52" font-weight="900" letter-spacing="-1">VELQRON</text>
    
    <!-- Description lines -->
    <text x="0" y="110" fill="#cbd5e1" font-size="18" font-weight="500">Local-first Motor Stress Explanation System</text>
    <text x="0" y="138" fill="#64748b" font-size="14" font-weight="400">Translating raw telemetry into physically grounded mechanical truths.</text>

    <!-- Key Metrics Pills -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="145" height="54" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" fill="#64748b" font-size="11" font-weight="700">PHYSICS CORE</text>
      <text x="16" y="42" fill="#38bdf8" font-size="16" font-weight="800">LPTN + DSP</text>

      <rect x="155" y="0" width="145" height="54" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="171" y="22" fill="#64748b" font-size="11" font-weight="700">PRIVACY</text>
      <text x="171" y="42" fill="#34d399" font-size="16" font-weight="800">100% Offline</text>

      <rect x="310" y="0" width="145" height="54" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="326" y="22" fill="#64748b" font-size="11" font-weight="700">EXPLANATION</text>
      <text x="326" y="42" fill="#fbbf24" font-size="16" font-weight="800">Local LLM</text>
    </g>

    <!-- Bottom Protocol Badges -->
    <g transform="translate(0, 260)">
      <text x="0" y="15" fill="#475569" font-size="12" font-weight="600">Hardware Nodes:</text>
      <text x="110" y="15" fill="#94a3b8" font-size="12" font-weight="700">ESP32 / Waveshare S3 RS485-CAN</text>
    </g>
  </g>

  <!-- Right Side: 3-Engine Core Visual Diagram -->
  <g transform="translate(560, 50)" filter="url(#shadow)">
    <!-- Container Panel -->
    <rect x="0" y="0" width="585" height="380" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Header bar -->
    <path d="M 0 14 Q 0 0 14 0 L 571 0 Q 585 0 585 14 L 585 45 L 0 45 Z" fill="#1e293b"/>
    <circle cx="20" cy="22" r="5" fill="#ef4444"/>
    <circle cx="36" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="22" r="5" fill="#10b981"/>
    <text x="75" y="27" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="0.5">VELQRON 3-ENGINE INTELLIGENCE PIPELINE</text>

    <!-- Raw Data Input Step -->
    <g transform="translate(25, 70)">
      <rect x="0" y="0" width="535" height="42" rx="6" fill="#182238" stroke="#334155" stroke-width="1"/>
      <text x="15" y="26" fill="#38bdf8" font-size="12" font-weight="800">[INGESTION]</text>
      <text x="115" y="26" fill="#e2e8f0" font-size="12" font-weight="600">Modbus RTU / ESP32 Sensors (CT + Temp + ADXL345 Vibration)</text>
    </g>

    <!-- Connector Arrow 1 -->
    <path d="M 292 112 L 292 128" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Engine 1: Signal Engine -->
    <g transform="translate(25, 130)">
      <rect x="0" y="0" width="165" height="85" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <rect x="10" y="10" width="60" height="18" rx="4" fill="#0891b2"/>
      <text x="16" y="23" fill="#ffffff" font-size="10" font-weight="800">ENGINE 1</text>
      <text x="10" y="46" fill="#ffffff" font-size="14" font-weight="800">Signal Engine</text>
      <text x="10" y="66" fill="#94a3b8" font-size="11" font-weight="500">FFT DSP + ONNX</text>
    </g>

    <!-- Connector 1->2 -->
    <path d="M 190 172 L 208 172" stroke="#38bdf8" stroke-width="2"/>

    <!-- Engine 2: Logic Engine -->
    <g transform="translate(210, 130)">
      <rect x="0" y="0" width="165" height="85" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="10" y="10" width="60" height="18" rx="4" fill="#d97706"/>
      <text x="16" y="23" fill="#ffffff" font-size="10" font-weight="800">ENGINE 2</text>
      <text x="10" y="46" fill="#ffffff" font-size="14" font-weight="800">Logic Engine</text>
      <text x="10" y="66" fill="#94a3b8" font-size="11" font-weight="500">LPTN Physics &amp; RAG</text>
    </g>

    <!-- Connector 2->3 -->
    <path d="M 375 172 L 393 172" stroke="#f59e0b" stroke-width="2"/>

    <!-- Engine 3: Decision Engine -->
    <g transform="translate(395, 130)">
      <rect x="0" y="0" width="165" height="85" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="10" y="10" width="60" height="18" rx="4" fill="#059669"/>
      <text x="16" y="23" fill="#ffffff" font-size="10" font-weight="800">ENGINE 3</text>
      <text x="10" y="46" fill="#ffffff" font-size="14" font-weight="800">Decision Engine</text>
      <text x="10" y="66" fill="#94a3b8" font-size="11" font-weight="500">Bayesian &amp; Interlock</text>
    </g>

    <!-- Connector Arrow Down to Explanation -->
    <path d="M 292 215 L 292 235" stroke="#10b981" stroke-width="2"/>

    <!-- Expert Agent Ensemble + LLM Synthesizer -->
    <g transform="translate(25, 238)">
      <rect x="0" y="0" width="535" height="65" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="15" y="24" fill="#3b82f6" font-size="11" font-weight="800">EXPERT AGENTS &amp; LOCAL LLM EXPLAINER</text>
      <text x="15" y="48" fill="#cbd5e1" font-size="12" font-weight="500">Thermal + Bearing + Electrical Agents supply domain physics context to Ollama.</text>
    </g>

    <!-- Output Banner -->
    <g transform="translate(25, 315)">
      <rect x="0" y="0" width="535" height="46" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="28" fill="#10b981" font-size="12" font-weight="800">[PHYSICAL VERDICT]</text>
      <text x="160" y="28" fill="#ffffff" font-size="12" font-weight="700">100% Audit-Safe Plain Language Technical Truth</text>
    </g>
  </g>
</svg>
